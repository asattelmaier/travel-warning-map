name: Backend Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build
        working-directory: ./backend
        run: npm run build

      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      - name: Login to GCR
        env:
          PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCLOUD_SA_KEY }}
          project_id: ${{ env.GCLOUD_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
          IMAGE_NAME: travel-warning-api
        with:
          context: ./backend
          push: true
          file: ./backend/Dockerfile
          tags: |
            eu.gcr.io/${{ secrets.GCLOUD_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            eu.gcr.io/${{ secrets.GCLOUD_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        env:
          SERVICE_NAME: travel-warning-api
          IMAGE_NAME: travel-warning-api
          REGION: europe-west1
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image eu.gcr.io/${{ secrets.GCLOUD_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --project=${{ secrets.GCLOUD_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated
