name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'infrastructure/frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'infrastructure/frontend/**'

env:
  PROJECT_ID: travelwarningmap
  REGION: europe-west1
  BUCKET_NAME: travel-warning-map-frontend
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: infrastructure/frontend
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/frontend
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/frontend
        run: terraform apply -auto-approve tfplan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          TRAVEL_WARNINGS_API_URL: ${{ secrets.TRAVEL_WARNINGS_API_URL }}
        run: npm run build -- --configuration production

      - name: Deploy to Cloud Storage
        run: |
          gsutil -m cp -r frontend/dist/travel-warning-map/* gs://${{ env.BUCKET_NAME }}/
          gsutil -m cp frontend/dist/travel-warning-map/index.html gs://${{ env.BUCKET_NAME }}/index.html 