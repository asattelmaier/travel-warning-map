<div *ngIf="errorMessage" class="error-message">
  {{ errorMessage }}
</div>

<div *ngIf="!isGoogleMapsReady && !errorMessage" class="loading-message">
  Loading Google Maps...
</div>

<app-info-modal *ngIf="showModal" (close)="closeModal()"></app-info-modal>
<app-map *ngIf="isGoogleMapsReady"></app-map>
