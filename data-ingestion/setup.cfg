[metadata]
name = data_ingestion
version = 0.1.0
description = Data ingestion script for Auswärtiges Amt Open Data
long_description = file: README.md
long_description_content_type = text/markdown
author = Alexander Sattelmaier
author_email = alexander@sattelmaier.info
license = MIT
url = https://github.com/asattelmaier/travel-warning-map

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8
install_requires =
    requests>=2.28
    google-api-python-client>=2.0
    google-auth>=2.0

[options.entry_points]
console_scripts =
    data-ingest = data_ingestion:main

[tool:pytest]
addopts = --verbose
testpaths = tests

[flake8]
max-line-length = 88
exclude = .git,__pycache__,docs

[isort]
profile = black
