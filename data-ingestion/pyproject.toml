[build-system]
requires = [
    "setuptools>=61.0",  # setuptools 61+ adds PEP 621 support
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "data_ingestion"
version = "0.1.0"
description = "Data ingestion script for Auswärtiges Amt Open Data"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",                    # HTTP client library
    "google-api-python-client>=2.0",    # Google Drive API client
    "google-auth>=2.0"                  # Authentication for Google APIs
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",   # testing framework
    "flake8>=5.0"    # Linting
]

[project.scripts]
data-ingest = "data_ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]
